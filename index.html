<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MOO TYPE 发布与数据看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet"/>
<style>

:root {
  --ink: #1a2332;
  --muted: #5d6b7c;
  --paper: #e8eef3;
  --surface: #fbfcfd;
  --line: #d5dee7;
  --blue: #1e4574;
  --blue-soft: #e7eef6;
  --wait: #8d5314;
  --wait-bg: #f8f1e6;
  --ok: #1c6844;
  --ok-bg: #e7f3ec;
  --danger: #9f2d22;
  --danger-bg: #fdeceb;
  color: var(--ink);
  background: var(--paper);
  font-family: Figtree, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.45;
}
* { box-sizing: border-box; }
body {
  max-width: 880px;
  margin: 0 auto;
  padding: 28px 20px calc(48px + env(safe-area-inset-bottom));
}
.mast { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
h1 {
  margin: 0;
  font-family: Fraunces, "Iowan Old Style", Palatino, serif;
  font-weight: 560;
  font-size: 2.4rem;
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.lede { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.sub { margin: 0; color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
h2 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.35; font-family: inherit; }
.cards {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  margin: 0 0 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.card { background: transparent; padding: 12px 12px 11px; box-shadow: none; border-radius: 0; }
.card + .card { box-shadow: inset 1px 0 0 var(--line); }
.card .k { font-size: 12px; color: var(--muted); font-weight: 500; }
.card .v { font-size: 1.25rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.note {
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0 2px 10px;
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
}
.note a { color: var(--blue); }
.note-row { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.note-toggle {
  border: 0; background: transparent; color: var(--blue); font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; padding: 0;
}
.note-body { margin-top: 8px; color: var(--ink); }
.note-body p { margin: 0 0 6px; }
.api-status { margin-top: 8px; }
.sync-alert {
  background: var(--danger-bg);
  border: 1px solid #f3c2bc;
  border-left: 4px solid var(--danger);
  border-radius: 12px;
  padding: 14px 14px 12px;
  margin: 0 0 14px;
  color: #3f1512;
  font-size: 15px;
  line-height: 1.55;
}
.sync-alert.config { background: #f8f1e6; border-color: #ead7b8; border-left-color: var(--wait); color: #4a2a10; }
.sync-alert-title { font-size: 1.05rem; font-weight: 700; line-height: 1.35; margin: 0 0 8px; }
.sync-alert p { margin: 0 0 8px; }
.sync-alert strong { font-weight: 700; }
.sync-raw { margin-top: -4px; font-size: 12px; line-height: 1.45; color: #6e332c; overflow-wrap: anywhere; }
.sync-alert.config .sync-raw { color: #7a5330; }
.sync-alert .retry {
  display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 4px;
  background: var(--danger); color: #fff; font-weight: 600; font-size: 16px; min-height: 44px;
  padding: 10px 18px; border-radius: 10px; border: 0;
}
.sync-alert .retry:hover, .sync-alert .retry:focus-visible { background: #7f241c; color: #fff; }
.card.unsynced { background: #fff7f6; box-shadow: inset 0 3px 0 var(--danger); }
.card.unsynced .v { color: var(--danger); font-size: 1.05rem; }
.chip.unsynced { color: var(--danger); }
.chip.unsynced.on { background: var(--danger); color: #fff; }
.badge.unsynced { background: var(--danger-bg); color: #9b1c1c; font-weight: 600; }
.metric.unsynced { background: #fff1ef; }
.metric.unsynced .mv { color: var(--danger); font-size: 13px; }
.sync-form-note { flex-basis: 100%; background: var(--danger-bg); color: #7a1c14; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
.sync-form-note.config { background: #f8f1e6; color: #8a4b12; }
.toolbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin: 0 -20px 12px; padding: 8px 20px 10px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(10px);
}
.filter-group { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.chip { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); box-shadow: none; }
.chip.on { background: var(--ink); color: #fff; }
.search { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 4px 0 12px; flex: 1 1 180px; max-width: 280px; min-width: 140px; }
.search input { border: 0; background: transparent; font: inherit; font-size: 14px; padding: 8px 0; width: 100%; min-width: 0; outline: none; color: var(--ink); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search .clear { border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: 16px; line-height: 1; padding: 4px 8px; }
.token { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 13px; color: var(--muted); }
.token input { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; width: 168px; background: var(--surface); color: var(--ink); }
.token-saved { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ok); margin-left: auto; }
.count { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--muted); }
.count:empty { display: none; }
.toast { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 8px 12px; margin: 0 0 8px; font-size: 14px; font-weight: 600; }
#list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { background: transparent; border-radius: 0; padding: 12px 14px; margin: 0; box-shadow: none; border-bottom: 1px solid var(--line); scroll-margin-top: 72px; }
.item:last-child { border-bottom: 0; }
.item-wait { box-shadow: inset 3px 0 0 #e0b06a; }
.item-ok { box-shadow: inset 3px 0 0 #8fceaa; }
.item-unsynced { box-shadow: inset 3px 0 0 var(--danger); }
.item.open { background: #f4f7fb; }
.item.just { background: #f3faf6; }
.item-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; }
.title-wrap { min-width: 0; }
.title-line { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-width: 0; }
.bits { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; flex: 1; }
.bit { font-size: 11px; line-height: 1.2; color: var(--muted); background: #eef2f6; border-radius: 999px; padding: 3px 7px; white-space: nowrap; }
.bit.en { color: #7a3e62; background: #f8eef3; }
.aside { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.glance { display: flex; gap: 12px; }
.glance-cell { display: flex; flex-direction: row; align-items: baseline; gap: 4px; }
.glance-k { font-size: 12px; color: var(--muted); }
.glance-v { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; letter-spacing: -0.02em; }
.text-link { color: var(--blue); font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.text-link:hover { text-decoration: underline; }
.segs, .lang-switch { display: flex; flex-wrap: wrap; gap: 4px; }
.lang-switch { margin: 0 0 10px; }
.segs { flex: none; }
.seg {
  border: 0; background: transparent; color: var(--muted); border-radius: 999px;
  padding: 4px 9px; min-height: 28px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
}
.seg:hover { background: #e7eef5; color: var(--ink); }
.seg.on { background: var(--ink); color: #fff; }
.seg.emphasis:not(.on) { color: var(--blue); background: var(--blue-soft); }
.panel { margin: 12px 0 2px; padding-top: 12px; border-top: 1px solid var(--line); background: transparent; border-radius: 0; }
.panel .metrics { margin: 0 0 6px; }
.panel .stat-time, .panel .copy-block { margin-bottom: 0; }
.panel .copy-block { margin-top: 0; }
.file-group + .file-group { margin-top: 10px; }
.muted { color: var(--muted); font-size: 12px; line-height: 1.45; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: #eef2f6; color: var(--muted); white-space: nowrap; }
.badge.wait { background: var(--wait-bg); color: var(--wait); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 0; }
.metric { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.mk { font-size: 11px; color: var(--muted); }
.mv { font-variant-numeric: tabular-nums; font-weight: 600; margin-top: 2px; }
.stat-time { margin: 6px 0 0; }
.copy-block { margin: 0 0 8px; }
.copy-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.copy-text {
  white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin: 0 0 8px; font: inherit; font-size: 14px; line-height: 1.55;
  max-height: 180px; overflow: auto;
}
.links, .publish-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 7px 12px; min-height: 36px; border-radius: 9px;
  background: #fff; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); cursor: pointer; font-family: inherit;
}
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn:hover { background: var(--blue-soft); }
.btn.primary:hover { background: #17385d; color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.publish-form input[type="url"] {
  flex: 1 1 220px; border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px;
  font: inherit; background: #fff; color: var(--ink); min-height: 40px;
}
.form-msg { flex-basis: 100%; font-size: 13px; min-height: 1.2em; }
.form-msg:empty { display: none; }
.form-msg.ok { color: var(--ok); font-weight: 600; }
.form-msg.bad { color: var(--danger); font-weight: 600; }
.published-link { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.post-link { word-break: break-all; }
.empty { padding: 18px 16px; color: var(--muted); }
footer { margin: 14px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.seg:focus-visible, .chip:focus-visible, .btn:focus-visible, .text-link:focus-visible,
.note-toggle:focus-visible, .token-saved:focus-visible, .search .clear:focus-visible,
.token input:focus-visible, .search input:focus-visible, .publish-form input:focus-visible {
  outline: 2px solid var(--blue); outline-offset: 2px;
}
@media (max-width: 720px) {
  body { padding: 16px 0 calc(28px + env(safe-area-inset-bottom)); }
  .mast, #sync-alert, #summary, #banner, footer, #toast { margin-left: 16px; margin-right: 16px; }
  .mast { align-items: flex-start; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  h1 { font-size: 2rem; }
  .sub { text-align: left; white-space: normal; }
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card:nth-child(3n + 1) { box-shadow: none; }
  .card:nth-child(n + 4) { box-shadow: inset 0 1px 0 var(--line); }
  .card:nth-child(3n + 2), .card:nth-child(3n + 3) { box-shadow: inset 1px 0 0 var(--line); }
  .card:nth-child(n + 4):nth-child(3n + 2), .card:nth-child(n + 4):nth-child(3n + 3) { box-shadow: inset 1px 0 0 var(--line), inset 0 1px 0 var(--line); }
  .note-row { flex-direction: column; align-items: flex-start; gap: 6px; }
  .toolbar { margin: 0 0 10px; padding: 8px 16px; gap: 8px; }
  .filter-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; border-radius: 12px; }
  .chip { text-align: center; min-height: 40px; }
  .search { max-width: none; flex: 1 1 100%; min-height: 44px; }
  .token, .token-saved { margin-left: 0; width: 100%; }
  .token input { flex: 1; width: auto; min-width: 0; font-size: 16px; }
  .search input, .publish-form input[type="url"] { font-size: 16px; }
  #list { border-radius: 0; border-left: 0; border-right: 0; }
  .item { padding: 12px 14px 12px 16px; }
  .item-top { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
  .aside { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; min-width: 0; }
  .glance-cell { align-items: flex-start; }
  .meta-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .segs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
  .seg { min-height: 40px; padding: 8px 2px; font-size: 13px; background: #fff; border: 1px solid var(--line); }
  .seg.on { border-color: var(--ink); }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .publish-form { flex-direction: column; align-items: stretch; }
  .publish-form input[type="url"] { flex: 0 0 auto; width: 100%; min-height: 44px; }
  .publish-form .btn { width: 100%; min-height: 44px; }
  .sync-alert { padding: 14px 12px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .seg, .chip, .btn { transition: none; }
}
</style>
</head>
<body>
<header class="mast">
  <div>
    <h1>Moo type</h1>
    <p class="lede">成片发布台</p>
  </div>
  <p class="sub" id="subtitle">正在读取目录</p>
</header>
<div id="sync-alert" hidden></div>
<div class="cards" id="summary"></div>
<div class="note" id="banner">正在加载成片…</div>
<div class="toolbar" id="filters"></div>
<div id="list"></div>
<footer>成片在网盘里。点每条上的「文案」「下载」「数据」「填链接」再展开。这个页面不会登录 TikTok。</footer>
<noscript>请启用 JavaScript。这个看板要从 catalog.json 读成片，并在页面上提交发布链接。</noscript>
<script src="site-config.js"></script>
<script type="module" src="app.js?v=20261125f"></script>
</body>
</html>
