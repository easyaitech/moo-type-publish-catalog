<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MOO TYPE 发布与数据看板</title>
<style>
:root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; background: #f4f1ec; }
body { max-width: 920px; margin: 0 auto; padding: 20px 16px 64px; }
h1 { font-size: 1.35rem; margin: 0 0 4px; }
h2 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.35; }
.sub { color: #666; margin: 0 0 12px; line-height: 1.4; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.card { background: #fff; border-radius: 10px; padding: 8px 10px 7px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.card .k { font-size: 11px; color: #666; }
.card .v { font-size: 1.15rem; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
.note { background: #fff8e8; border: 1px solid #f0d9a0; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.note a { color: #9a4316; }
.note-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.note-toggle { border: 0; background: transparent; color: #9a4316; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.note-body { margin-top: 8px; }
.note-body p { margin: 0 0 6px; }
.api-status { margin-top: 8px; }
.sync-alert {
  background: #fdecea;
  border: 1px solid #f3c1bb;
  border-left: 6px solid #d92d20;
  border-radius: 12px;
  padding: 14px 14px 12px;
  margin: 0 0 14px;
  color: #3f1512;
  font-size: 15px;
  line-height: 1.55;
}
.sync-alert.config {
  background: #fff6e8;
  border-color: #f0d0a0;
  border-left-color: #c2410c;
  color: #4a2a10;
}
.sync-alert-title {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1.35;
  margin: 0 0 8px;
}
.sync-alert p { margin: 0 0 8px; }
.sync-alert strong { font-weight: 800; }
.sync-raw {
  margin-top: -4px;
  font-size: 12px;
  line-height: 1.45;
  color: #6e332c;
  overflow-wrap: anywhere;
}
.sync-alert.config .sync-raw { color: #7a5330; }
.sync-alert .retry {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-top: 4px;
  background: #d92d20;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 10px;
}
.sync-alert .retry:hover,
.sync-alert .retry:focus-visible { background: #b42318; color: #fff; }
.sync-alert .retry:focus-visible { outline: 2px solid #7a1c14; outline-offset: 2px; }
.card.unsynced {
  background: #fff7f6;
  box-shadow: inset 0 3px 0 #d92d20, 0 1px 4px rgba(0,0,0,.06);
}
.card.unsynced .v { color: #b42318; font-size: 1.15rem; }
.chip.unsynced {
  background: #fff6f5;
  color: #9b1c1c;
  box-shadow: inset 0 0 0 1.5px #e7b4ae;
}
.chip.unsynced.on { background: #b42318; color: #fff; box-shadow: none; }
.badge.unsynced {
  background: #fdecea;
  color: #9b1c1c;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px #f0b4ae;
}
.metric.unsynced { background: #fff1ef; }
.metric.unsynced .mv { color: #b42318; font-size: 13px; }
.sync-form-note {
  flex-basis: 100%;
  background: #fdecea;
  color: #7a1c14;
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.5;
}
.sync-form-note.config { background: #fff6e8; color: #8a4b12; }
.toolbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 0 -16px 8px;
  padding: 8px 16px;
  background: rgba(244, 241, 236, .94);
  backdrop-filter: blur(8px);
}
.chip { border: 0; background: #fff; border-radius: 999px; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.chip.on { background: #ff7a3d; color: #fff; }
.search { display: flex; align-items: center; gap: 2px; background: #fff; border-radius: 999px; padding: 0 4px 0 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); flex: 1 1 140px; max-width: 220px; min-width: 120px; }
.search input { border: 0; background: transparent; font: inherit; font-size: 13px; padding: 7px 0; width: 100%; min-width: 0; outline: none; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search .clear { border: 0; background: transparent; color: #666; cursor: pointer; font: inherit; font-size: 16px; line-height: 1; padding: 4px 6px; }
.token { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; color: #444; }
.token input { border: 1px solid #ddd; border-radius: 8px; padding: 7px 8px; font: inherit; width: 148px; background: #fff; }
.token-saved { border: 0; background: #fff; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; color: #1b7a3a; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.count { flex-basis: 100%; margin: 0; font-size: 12px; color: #777; }
.toast { background: #e6f6ea; color: #146c32; border-radius: 10px; padding: 8px 12px; margin: 0 0 8px; font-size: 14px; }
.item { background: #fff; border-radius: 12px; padding: 7px 10px 7px 12px; margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.05); scroll-margin-top: 64px; }
.item-wait { box-shadow: inset 3px 0 0 #ff7a3d, 0 1px 3px rgba(0,0,0,.05); }
.item-ok { box-shadow: inset 3px 0 0 #8fceaa, 0 1px 3px rgba(0,0,0,.04); }
.item-unsynced { box-shadow: inset 3px 0 0 #d92d20, 0 1px 3px rgba(0,0,0,.05); }
.item.just { background: #f3fbf5; }
.item-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.badge { margin-top: 0; }
.title-wrap { min-width: 0; }
.title-line { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; min-width: 0; }
.meta-line { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aside { text-align: right; font-size: 12px; line-height: 1.35; }
.glance { font-variant-numeric: tabular-nums; font-weight: 600; color: #1a1a1a; white-space: nowrap; }
.text-link { color: #9a4316; font-size: 12px; text-decoration: none; white-space: nowrap; }
.text-link:hover { text-decoration: underline; }
.segs, .lang-switch { display: flex; flex-wrap: wrap; gap: 6px; }
.lang-switch { margin: 0 0 8px; }
.segs { flex: none; }
.seg { border: 0; background: #f3efe8; color: #333; border-radius: 999px; padding: 4px 10px; min-height: 32px; font: inherit; font-size: 12px; cursor: pointer; }
.seg:hover { background: #ffe4d6; }
.seg.on { background: #ff7a3d; color: #fff; }
.seg.emphasis:not(.on) { background: #fff1e8; color: #9a4316; box-shadow: inset 0 0 0 1px #f0c2a8; }
.panel { margin-top: 8px; background: #faf7f2; border-radius: 10px; padding: 10px; }
.panel .metrics { margin: 0 0 4px; }
.panel .stat-time, .panel .copy-block { margin-bottom: 0; }
.panel .copy-block { margin-top: 0; }
.file-group + .file-group { margin-top: 8px; }
.muted { color: #777; font-size: 12px; line-height: 1.45; }
.badge { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #eee; white-space: nowrap; }
.badge.wait { background: #fff1d6; color: #8a5a00; }
.badge.ok { background: #e6f6ea; color: #1b7a3a; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.metric { background: #f7f4ef; border-radius: 10px; padding: 8px; }
.mk { font-size: 11px; color: #666; }
.mv { font-variant-numeric: tabular-nums; font-weight: 700; margin-top: 2px; }
.stat-time { margin-bottom: 10px; }
.copy-block { margin: 8px 0 10px; }
.copy-label { font-size: 12px; color: #666; margin-bottom: 6px; }
.copy-text { white-space: pre-wrap; background: #fff; border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; font: inherit; font-size: 13px; line-height: 1.45; max-height: 140px; overflow: auto; }
.links, .publish-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { display: inline-block; padding: 6px 10px; border-radius: 8px; background: #eee; color: #111; text-decoration: none; font-size: 12px; border: 0; cursor: pointer; font: inherit; }
.btn.primary { background: #ffe4d6; color: #8a3410; }
.btn:hover { background: #ff7a3d; color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.publish { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0ebe4; }
.publish-form input[type="url"] { flex: 1 1 220px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font: inherit; }
.form-msg { flex-basis: 100%; font-size: 13px; min-height: 1.2em; }
.form-msg:empty { display: none; }
.form-msg.ok { color: #1b7a3a; }
.form-msg.bad { color: #9a3410; }
.published-link { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.post-link { word-break: break-all; }
.empty { background: #fff; border-radius: 12px; padding: 14px; }
footer { margin-top: 14px; color: #888; font-size: 12px; line-height: 1.5; }
.seg:focus-visible, .chip:focus-visible, .btn:focus-visible, .text-link:focus-visible, .note-toggle:focus-visible, .token-saved:focus-visible, .search .clear:focus-visible {
  outline: 2px solid #c2410c;
  outline-offset: 2px;
}
@media (max-width: 720px) {
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .token { margin-left: 0; }
  .search { max-width: none; flex-basis: 100%; }
}
@media (max-width: 640px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .token { width: 100%; margin-left: 0; }
  .token span { flex: none; white-space: nowrap; }
  .token input { flex: 1; width: auto; min-width: 0; }
  .sync-alert { padding: 14px 12px 12px; }
  .cards { display: flex; overflow-x: auto; grid-template-columns: none; }
  .card { flex: 0 0 108px; }
  .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-top { grid-template-columns: auto minmax(0, 1fr); }
  .aside { grid-column: 2; text-align: left; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .meta-row { flex-wrap: wrap; }
  .glance { white-space: normal; }
  .seg { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .item { padding: 10px 10px 10px 12px; }
}
</style>
</head>
<body>
<h1>MOO TYPE 发布与数据看板</h1>
<p class="sub" id="subtitle">成片包 · 待发布 / 已发布</p>
<div id="sync-alert" hidden></div>
<div class="cards" id="summary"></div>
<div class="note" id="banner">正在加载成片…</div>
<div class="toolbar" id="filters"></div>
<div id="list"></div>
<footer>成片在网盘里。点每条上的「文案」「下载」「数据」「填链接」再展开。这个页面不会登录 TikTok。</footer>
<noscript>请启用 JavaScript。这个看板要从 catalog.json 读成片，并在页面上提交发布链接。</noscript>
<script src="site-config.js"></script>
<script type="module" src="app.js?v=20261125d"></script>
</body>
</html>
