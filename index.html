<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MOO TYPE 发布与数据看板</title>
<style>
:root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; background: #f4f1ec; }
body { max-width: 920px; margin: 0 auto; padding: 24px 16px 72px; }
h1 { font-size: 1.55rem; margin: 0 0 6px; }
h2 { font-size: 1.05rem; margin: 0; }
.sub { color: #555; margin: 0 0 18px; line-height: 1.5; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { background: #fff; border-radius: 12px; padding: 14px 14px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card .k { font-size: 12px; color: #666; }
.card .v { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
.note { background: #fff8e8; border: 1px solid #f0d9a0; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.55; }
.note a { color: #9a4316; }
.api-status { margin-top: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.chip { border: 0; background: #fff; border-radius: 999px; padding: 7px 12px; cursor: pointer; font: inherit; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.chip.on { background: #ff7a3d; color: #fff; }
.token { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; color: #444; }
.token input { border: 1px solid #ddd; border-radius: 8px; padding: 7px 8px; font: inherit; min-width: 180px; background: #fff; }
.item { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.item-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.muted { color: #777; font-size: 12px; line-height: 1.45; }
.badge { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #eee; white-space: nowrap; }
.badge.wait { background: #fff1d6; color: #8a5a00; }
.badge.ok { background: #e6f6ea; color: #1b7a3a; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.metric { background: #f7f4ef; border-radius: 10px; padding: 8px; }
.mk { font-size: 11px; color: #666; }
.mv { font-variant-numeric: tabular-nums; font-weight: 700; margin-top: 2px; }
.stat-time { margin-bottom: 10px; }
.copy-block { margin: 8px 0 10px; }
.copy-label { font-size: 12px; color: #666; margin-bottom: 6px; }
.copy-text { white-space: pre-wrap; background: #f7f4ef; border-radius: 10px; padding: 10px; margin: 0 0 8px; font: inherit; font-size: 14px; line-height: 1.5; max-height: 220px; overflow: auto; }
.links, .publish-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { display: inline-block; padding: 6px 10px; border-radius: 8px; background: #eee; color: #111; text-decoration: none; font-size: 12px; border: 0; cursor: pointer; font: inherit; }
.btn.primary { background: #ffe4d6; color: #8a3410; }
.btn:hover { background: #ff7a3d; color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.publish { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0ebe4; }
.publish-form input[type="url"] { flex: 1 1 220px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font: inherit; }
.form-msg { flex-basis: 100%; font-size: 13px; min-height: 1.2em; }
.form-msg.ok { color: #1b7a3a; }
.form-msg.bad { color: #9a3410; }
.published-link { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.post-link { word-break: break-all; }
.empty { background: #fff; border-radius: 12px; padding: 16px; }
footer { margin-top: 18px; color: #777; font-size: 12px; line-height: 1.5; }
@media (max-width: 640px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .token { margin-left: 0; width: 100%; }
  .token input { flex: 1; min-width: 0; }
}
</style>
</head>
<body>
<h1>MOO TYPE 发布与数据看板</h1>
<p class="sub" id="subtitle">成片包 · 待发布 / 已发布</p>
<div class="cards" id="summary"></div>
<div class="note" id="banner">正在加载成片…</div>
<div class="toolbar" id="filters"></div>
<div id="list"></div>
<footer>成片留在网盘，不放在 GitHub 上。发布链接由朋友在页面提交；播放、点赞、评论、分享、收藏由助理回填。Bot 不登录 TikTok 自动抓取。</footer>
<noscript>请启用 JavaScript。这个看板要从 catalog.json 读成片，并在页面上提交发布链接。</noscript>
<script src="site-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
