name: test

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Catalog and page merge tests
        run: python3 -m unittest tests.test_catalog -v && node --test tests/merge.test.mjs
      - name: Worker API tests
        working-directory: worker
        run: npm ci && npm test
